name: Chromatic Upload (reusable)

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Name of the Storybook build artifact to download'
        type: string
        default: 'storybook-static'
    secrets:
      chromatic-project-token:
        description: 'Chromatic project token'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-24.04
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push')
    outputs:
      storybookUrl: ${{ steps.chromatic.outputs.storybookUrl }}
      buildUrl: ${{ steps.chromatic.outputs.buildUrl }}
    steps:
      - name: Checkout Base Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Fetch triggering commit
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          trap 'git config --unset-all http.https://github.com/.extraheader || true' EXIT
          if git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            exit 0
          fi
          git fetch --no-tags origin "$HEAD_SHA" \
            || git fetch origin '+refs/pull/*/head:refs/remotes/pull/*'
          git rev-parse --verify "${HEAD_SHA}^{commit}"

      - name: Download Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: storybook-static
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Chromatic
        id: chromatic
        uses: chromaui/action@534eebfc19023579541d106f7b61d5ad70ed65c7 # v18.5.0
        with:
          projectToken: ${{ secrets.chromatic-project-token }}
          storybookBuildDir: storybook-static
          autoAcceptChanges: ${{ github.event.workflow_run.event == 'push' }}
        env:
          CHROMATIC_SHA: ${{ github.event.workflow_run.head_sha }}
          CHROMATIC_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CHROMATIC_SLUG: ${{ github.repository }}

  comment:
    runs-on: ubuntu-24.04
    needs: [upload]
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Find PR number
        id: find-pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          result-encoding: string
          script: |
            const prs = context.payload.workflow_run.pull_requests;
            if (prs && prs.length > 0) {
              return prs[0].number;
            }
            const head_sha = context.payload.workflow_run.head_sha;
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: head_sha,
            });
            const matched = pulls.find(pr => pr.state === 'open');
            return matched ? matched.number : '';

      - name: Find existing comment
        id: find-comment
        if: steps.find-pr.outputs.result != ''
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        with:
          issue-number: ${{ steps.find-pr.outputs.result }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- chromatic-build -->'

      - name: Comment on PR
        if: steps.find-pr.outputs.result != ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ steps.find-pr.outputs.result }}
          edit-mode: replace
          body: |
            <!-- chromatic-build -->
            ### Chromatic Build

            | | Link |
            |---|---|
            | Storybook | ${{ needs.upload.outputs.storybookUrl }} |
            | Build | ${{ needs.upload.outputs.buildUrl }} |
