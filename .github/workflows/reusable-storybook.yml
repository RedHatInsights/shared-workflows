name: Storybook (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '22'
      build-command:
        description: 'Command to build Storybook'
        type: string
        default: 'npm run build-storybook'
      test-command:
        description: 'Self-contained command to run Storybook tests'
        type: string
        default: 'npm run test:storybook'
      storybook-dir:
        description: 'Output directory for the Storybook build'
        type: string
        default: 'storybook-static'
      artifact-name:
        description: 'Name of the uploaded Storybook artifact (must not contain slashes)'
        type: string
        default: 'storybook-static'
      run-tests:
        description: 'Whether to run Storybook tests'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Node setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: ${{ inputs.build-command }}

      - name: Upload Storybook Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.storybook-dir }}
          if-no-files-found: error
          retention-days: 3

  test:
    name: test
    runs-on: ubuntu-24.04
    if: inputs.run-tests
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Node setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx --no -- playwright install --with-deps chromium

      - name: Run Storybook tests
        run: ${{ inputs.test-command }}
