name: Storybook (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '22'
      build-command:
        description: 'Command to build Storybook'
        type: string
        default: 'npm run build-storybook'
      test-command:
        description: 'Command to run Storybook tests'
        type: string
        default: 'npm run test-storybook:ci'
      storybook-dir:
        description: 'Output directory for the Storybook build'
        type: string
        default: 'storybook-static'
      artifact-name:
        description: 'Name of the uploaded Storybook artifact (must not contain slashes)'
        type: string
        default: 'storybook-static'
      run-tests:
        description: 'Whether to run Storybook tests'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Node setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: ${{ inputs.build-command }}

      - name: Upload Storybook Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.storybook-dir }}
          retention-days: 3

  test:
    name: test
    runs-on: ubuntu-24.04
    needs: [build]
    if: inputs.run-tests
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download Storybook Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.storybook-dir }}

      - name: Node setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run Storybook tests
        run: |
          npx http-server ${{ inputs.storybook-dir }} --port 6006 --silent &
          npx wait-on --timeout 60000 http://localhost:6006
          ${{ inputs.test-command }} -- --url http://localhost:6006
        env:
          CI: true
